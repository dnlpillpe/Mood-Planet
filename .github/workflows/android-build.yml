name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar (ensamblar APK de depuración)
        run: ./gradlew assembleDebug --stacktrace

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: MoodPlanet-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Generar APK de release
    needs: build-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Ensamblar APK de release (sin firmar)
        run: ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$apk_path" dist/MoodPlanet-v1.0.0.apk

      - name: Publicar APK de release
        uses: actions/upload-artifact@v4
        with:
          name: MoodPlanet-v1.0.0.apk
          path: dist/MoodPlanet-v1.0.0.apk

      - name: Crear release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Mood Planet v1.0.0"
          files: dist/MoodPlanet-v1.0.0.apk
          body: |
            Mood Planet v1.0.0 — app educativa de aprendizaje socioemocional
            para niñas y niños de 8 a 12 años. No es terapia ni realiza
            diagnósticos psicológicos. Ver docs/ para la documentación
            completa (guía para familias/docentes, ficha técnica y política
            de privacidad).
